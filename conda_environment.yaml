name: robodiff
channels:
  - pytorch
  - pytorch3d
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip=22.2.2
  - cudatoolkit=11.6
  - pytorch=1.12.1
  - torchvision=0.13.1
  - pytorch3d=0.7.0
  - numpy=1.23.3
  - numba==0.56.4
  - scipy==1.9.1
  - py-opencv=4.6.0
  - cffi=1.15.1
  - ipykernel=6.16
  - matplotlib=3.6.1
  - zarr=2.12.0
  # Enables zarr.LMDBStore for the mtime-stamped training cache in
  # TraceDataset. Matches UMI's pinned version.
  - python-lmdb=1.4
  - numcodecs=0.10.2
  - h5py=3.7.0
  - hydra-core=1.2.0
  - einops=0.4.1
  - tqdm=4.64.1
  - dill=0.3.5.1
  - scikit-video=1.1.11
  - scikit-image=0.19.3
  - gym=0.21.0
  - pymunk=6.2.1
  - wandb=0.13.3
  - threadpoolctl=3.1.0
  - shapely=1.8.4
  - cython=0.29.32
  - imageio=2.22.0
  - imageio-ffmpeg=0.4.7
  - termcolor=2.0.1
  - tensorboard=2.10.1
  - tensorboardx=2.5.1
  - psutil=5.9.2
  - click=8.0.4
  - boto3=1.24.96
  - accelerate=0.13.2
  - datasets=2.6.1
  - diffusers=0.11.1
  - av=10.0.0
  - cmake=3.24.3
  # trick to avoid cpu affinity issue described in https://github.com/pytorch/pytorch/issues/99625
  - llvm-openmp=14
  # trick to force reinstall imagecodecs via pip
  - imagecodecs==2022.8.8
  - pip:
    # pip package required for jpeg-xl (overrides the conda-forge wheel above)
    - imagecodecs==2022.9.26
  # ---------------------------------------------------------------------------
  # Sim-only dependencies stripped for the welding/trace fork (real-world data,
  # no mujoco/robosuite/pybullet). The original upstream list had:
  #   ray[default,tune], free-mujoco-py, pygame, pybullet-svl, robosuite,
  #   robomimic, pytorchvideo, r3m, dm-control
  # None are imported by the trace training path (trace_dataset,
  # train_diffusion_unet_image_workspace, diffusion_unet_image_policy,
  # multi_image_obs_encoder, real_pusht_image_runner). free-mujoco-py / mujoco
  # in particular tried to build from source and failed on MUJOCO_PATH.
  # ---------------------------------------------------------------------------
