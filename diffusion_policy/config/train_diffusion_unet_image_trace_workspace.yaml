defaults:
  - _self_
  - task: trace_image

name: train_diffusion_unet_image_trace
_target_: diffusion_policy.workspace.train_diffusion_unet_image_workspace.TrainDiffusionUnetImageWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "default"

horizon: 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0
obs_as_global_cond: True

policy:
  _target_: diffusion_policy.policy.diffusion_unet_image_policy.DiffusionUnetImagePolicy

  shape_meta: ${shape_meta}

  # DDIM with the UMI training recipe (num_train_timesteps=50,
  # num_inference_steps=16). Same epsilon-prediction objective as DDPM
  # but the deterministic sampler lets us take ~6x fewer denoising steps
  # at inference for the same quality. Measured on this box: DDPM-100 was
  # ~1700 ms/predict (4.7 Hz effective), DDIM-16 is ~270 ms (~30 Hz). See
  # the timm_umi workspace yaml in the UMI repo for the validated recipe.
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 50
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

  obs_encoder:
    _target_: diffusion_policy.model.vision.multi_image_obs_encoder.MultiImageObsEncoder
    shape_meta: ${shape_meta}
    rgb_model:
      _target_: diffusion_policy.model.vision.model_getter.get_resnet
      name: resnet18
      weights: IMAGENET1K_V1
    # Images are already 224x224 out of the data-collection pipeline.
    resize_shape: null
    # Disable crop augmentation for the baseline; revisit if we overfit.
    crop_shape: null
    random_crop: False
    # Frozen pretrained ResNet -> BN running stats are load-bearing,
    # leave BN in place. Swap to use_group_norm=True only if we later
    # unfreeze the encoder (EMA corrupts BN running stats on fine-tune).
    use_group_norm: False
    # Stereo cams see different viewpoints; give each its own backbone.
    share_rgb_model: False
    imagenet_norm: True

  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  num_inference_steps: 16
  obs_as_global_cond: ${obs_as_global_cond}
  diffusion_step_embed_dim: 128
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: True

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  # batch_size and num_workers sized for the 30 GB RAM laptop: the
  # dataset returns (T=16, 3, 224, 224) float32 per cam per sample (~19
  # MB), so each batch × num_workers × prefetch_factor(2) sits in /dev/shm
  # as the DataLoader shuttles tensors back to the main process. At
  # batch_size=64 / num_workers=4 this was ~18 GB of shmem-rss and OOM'd.
  # 32 / 2 keeps shared memory around ~2.5 GB. On a bigger box, raise
  # both back up or refactor the dataset to keep images as uint8 until
  # the GPU.
  batch_size: 32
  num_workers: 2
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 32
  num_workers: 2
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  # optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 300
  gradient_accumulate_every: 1
  # EMA destroys performance when used with BatchNorm.
  # We keep BN intact and freeze the encoder instead (see obs_encoder note).
  use_ema: True
  freeze_encoder: True
  # training loop control (in epochs)
  # rollout_every is effectively disabled since the env_runner is a no-op,
  # but we keep it high to avoid noise in wandb logs.
  rollout_every: 100000
  checkpoint_every: 5
  val_every: 20
  # steps per epoch
  max_train_steps: null
  max_val_steps: null
  # misc
  tqdm_interval_sec: 1.0

logging:
  project: diffusion_policy_trace
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "${exp_name}"]
  id: null
  group: null

checkpoint:
  topk:
    # No env rollouts -> no test_mean_score. Use train_loss like UMI.
    monitor_key: train_loss
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-train_loss={train_loss:.4f}.ckpt'
  topk_val:
    monitor_key: val_pos_mse
    mode: min
    k: 5
    format_str: 'epoch={epoch:04d}-val_pos_mse={val_pos_mse:.6f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: /mnt/thousand-arms-data/outputs/trace/${task.dataset_shape}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: /mnt/thousand-arms-data/outputs/trace/${task.dataset_shape}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: /mnt/thousand-arms-data/outputs/trace/${task.dataset_shape}/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}
